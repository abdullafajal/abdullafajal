<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>{{ subject }}</title>
    <style type="text/css">
        body {
            background-color: #f4f6fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #e6ebf1;
            border-radius: 8px;
            overflow: hidden;
        }
        .card-body {
            padding: 15px 15px;
            text-align: center;
        }
        .icon-circle {
            background-color: #154d71; /* Homepage Theme Color */
            width: 64px;
            height: 64px;
            border-radius: 50%;
            line-height: 64px;
            color: #ffffff;
            font-size: 32px;
            margin: 0 auto 24px auto;
            display: block;
        }
        h1 {
            color: #232e3c;
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 16px 0;
        }
        .text-body {
            color: #656d77;
            font-size: 16px;
            line-height: 24px;
            margin-bottom: 16px;
            text-align: left;
        }
        .footer-signature {
            text-align: left;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e6ebf1;
        }
        .avatar-group {
            display: flex;
            align-items: center;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            background-color: #154d71;
            color: white;
            line-height: 48px;
            text-align: center;
            font-weight: bold;
            margin-right: 0;
            object-fit: cover;
        }
        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            body, .body-table { background-color: #1a2234 !important; }
            .card { background-color: #232e3c !important; border-color: #354153 !important; }
            h1, .sender-info { color: #ffffff !important; }
            .text-body, .sender-role, .social-title { color: #a8b0bd !important; }
            .footer-links, .footer-links a { color: #6e7683 !important; }
            .footer-signature { border-top-color: #354153 !important; }
            .social-section { background-color: #1f2936 !important; border-top-color: #354153 !important; }
        }

        /* Improved Typography */
        .sender-greeting {
            font-size: 14px;
            color: #656d77;
            font-weight: 400;
            line-height: 1.4;
            margin: 0;
            font-style: italic;
        }
        .sender-name {
            font-size: 15px;
            color: #232e3c;
            font-weight: 700;
            line-height: 1.4;
            margin: 0;
        }
        .sender-role {
            font-size: 12px;
            color: #656d77;
            font-weight: 400;
            line-height: 1.4;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .social-icons {
            margin-top: 24px;
            text-align: center;
            padding-top: 24px;
        }
        .social-link {
            display: inline-block;
            margin: 0 8px;
            text-decoration: none;
        }
        /* Using homepage color #154d71 for icons */
        .social-link svg {
            width: 24px;
            height: 24px;
            stroke: #154d71;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #656d77;
        }
        .footer-links a {
            color: #656d77;
            margin: 0 8px;
            text-decoration: none;
        }

        /* Responsive Mobile Styles */
        @media only screen and (max-width: 620px) {
            h1 {
                font-size: 20px !important;
            }
            h2 {
                font-size: 16px !important;
            }
            h3 {
                font-size: 14px !important;
            }   
            h4 {
                font-size: 12px !important;
            } 
            h5 {
                font-size: 10px !important;
            }
            h6 {
                font-size: 8px !important;
            }
            .text-body {
                font-size: 14px !important;
                line-height: 22px !important;
            }
            .sender-greeting, .sender-name, .sender-role {
                font-size: 12px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Logo Row -->
        <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 20px;">
            <tr>
                <td align="left" style="vertical-align: middle;">
                    <img src="https://abdullafajal.pythonanywhere.com/static/icons/icon-192-192.png" alt="Logo" width="32" height="32" style="vertical-align: middle; border-radius: 4px;">
                    <span style="font-weight: bold; color: #232e3c; font-size: 18px; vertical-align: middle;">Abdulla Fajal</span>
                </td>
            </tr>
        </table>

        <!-- Main Card -->
        <div class="card">
            <div class="card-body">
                <!-- Message Body -->
                <div class="text-body">
                    {{ message|safe }}
                </div>

                <!-- Signature -->
                <div class="footer-signature">
                    <table border="0" cellpadding="0" cellspacing="0">
                        <tr>
                            <td style="vertical-align: middle;">
                                <div style="display: flex; align-items: center;">
                                    <img src="https://abdullafajal.pythonanywhere.com/static/images/about.png" alt="Abdulla Fajal" class="avatar" style="display: block; margin-right: 10px;">
                                    <div>
                                        <div class="sender-greeting">Thank you,</div>
                                        <div class="sender-name">Abdulla Fajal</div>
                                        <div class="sender-role">Senior Django Developer</div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <!-- Social Media Icons (Using #154d71) -->
                <div class="social-icons">
                    <a href="https://github.com/abdullafajal" class="social-link" target="_blank">
                        <!-- GitHub Icon -->
                        <svg viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" /></svg>
                    </a>
                    <a href="https://www.linkedin.com/in/abdullafajal" class="social-link" target="_blank">
                        <!-- LinkedIn Icon -->
                        <svg viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 11v5" /><path d="M8 8v.01" /><path d="M12 16v-5" /><path d="M16 16v-3a2 2 0 1 0 -4 0" /><path d="M3 7a4 4 0 0 1 4 -4h10a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-10a4 4 0 0 1 -4 -4z" /></svg>
                    </a>
                    <a href="https://x.com/abdullafajal" class="social-link" target="_blank">
                         <!-- X/Twitter Icon -->
                        <svg viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 4l11.733 16h4.267l-11.733 -16z" /><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772" /></svg>
                    </a>
                    <a href="https://www.facebook.com/abdulla.fajal/" class="social-link" target="_blank">
                        <!-- Facebook Icon -->
                        <svg viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 10v4h3v7h4v-7h3l1 -4h-4v-2a1 1 0 0 1 1 -1h3v-4h-3a5 5 0 0 0 -5 5v2h-3" /></svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-links" style="margin-top: 8px;">
            &copy; {% now "Y" %} Abdulla Fajal. All rights reserved.
        </div>
    </div>
</body>
</html>
