<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>{{ subject }}</title>
    <style type="text/css">
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 30px 24px;
        }

        .card {
            background-color: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
            width: 100%;
        }

        .card-body {
            padding: 0;
            text-align: center;
        }

        .icon-circle {
            background-color: #154d71;
            /* Homepage Theme Color */
            width: 64px;
            height: 64px;
            border-radius: 50%;
            line-height: 64px;
            color: #ffffff;
            font-size: 32px;
            margin: 0 auto 24px auto;
            display: block;
        }

        h1 {
            color: #232e3c;
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 16px 0;
        }

        .text-body {
            color: #232e3c;
            font-size: 16px;
            line-height: 24px;
            margin-bottom: 16px;
            text-align: left;
        }

        .footer-signature {
            text-align: left;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e6ebf1;
        }

        .avatar-group {
            display: flex;
            align-items: center;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            background-color: #154d71;
            color: white;
            line-height: 48px;
            text-align: center;
            font-weight: bold;
            margin-right: 0;
            object-fit: cover;
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {

            body,
            .body-table {
                background-color: #1a2234 !important;
            }

            .card {
                background-color: transparent !important;
                border-color: transparent !important;
            }

            h1,
            .sender-info {
                color: #ffffff !important;
            }

            .text-body,
            .sender-role,
            .social-title {
                color: #a8b0bd !important;
            }

            .footer-links,
            .footer-links a {
                color: #6e7683 !important;
            }

            .footer-signature {
                border-top-color: #354153 !important;
            }

            .social-section {
                background-color: #1f2936 !important;
                border-top-color: #354153 !important;
            }
        }

        /* Improved Typography */
        .sender-greeting {
            font-size: 14px;
            color: #656d77;
            font-weight: 400;
            line-height: 1.4;
            margin: 0;
            font-style: italic;
        }

        .sender-name {
            font-size: 15px;
            color: #232e3c;
            font-weight: 700;
            line-height: 1.4;
            margin: 0;
        }

        .sender-role {
            font-size: 12px;
            color: #656d77;
            font-weight: 400;
            line-height: 1.4;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .social-icons {
            margin-top: 24px;
            text-align: center;
            padding-top: 24px;
        }

        .social-link {
            display: inline-block;
            margin: 0 8px;
            text-decoration: none;
        }


        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #656d77;
        }

        .footer-links a {
            color: #656d77;
            margin: 0 8px;
            text-decoration: none;
        }

        /* Responsive Mobile Styles */
        @media only screen and (max-width: 620px) {
            h1 {
                font-size: 20px !important;
            }

            h2 {
                font-size: 16px !important;
            }

            h3 {
                font-size: 14px !important;
            }

            h4 {
                font-size: 12px !important;
            }

            h5 {
                font-size: 10px !important;
            }

            h6 {
                font-size: 8px !important;
            }

            .text-body {
                font-size: 14px !important;
                line-height: 22px !important;
            }

            .sender-greeting,
            .sender-name,
            .sender-role {
                font-size: 12px !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main Card -->
        <div class="card">
            <div class="card-body">
                <!-- Message Body -->
                <div class="text-body">
                    {{ message|safe }}
                </div>

                <!-- Signature -->
                <div class="footer-signature">
                    <table border="0" cellpadding="0" cellspacing="0">
                        <tr>
                            <td style="vertical-align: middle;">
                                <div style="display: flex; align-items: center;">
                                    <img src="https://abdullafajal.pythonanywhere.com/static/images/about.png"
                                        alt="Abdulla" class="avatar" style="display: block; margin-right: 10px;">
                                    <div>
                                        <div class="sender-name">Abdulla</div>
                                        <div class="sender-role">Software Developer</div>
                                        <div class="sender-role" style="margin-top: 2px;"><a href="tel:+918958468602"
                                                style="color: #656d77; text-decoration: none;"><img
                                                    src="https://img.icons8.com/ios-filled/50/154d71/phone.png"
                                                    alt="Phone" width="12" height="12"
                                                    style="border:0;vertical-align:middle;margin-right:4px;">
                                                +91-8958468602</a></div>
                                        <div class="sender-role" style="margin-top: 2px;"><a
                                                href="mailto:abdullafajal@gmail.com"
                                                style="color: #656d77; text-decoration: none;"><img
                                                    src="https://img.icons8.com/ios-filled/50/154d71/new-post.png"
                                                    alt="Email" width="12" height="12"
                                                    style="border:0;vertical-align:middle;margin-right:4px;">
                                                abdullafajal@gmail.com</a></div>
                                        <div class="sender-role" style="margin-top: 2px;"><a
                                                href="https://github.com/abdullafajal" target="_blank"
                                                style="color: #656d77; text-decoration: none;"><img
                                                    src="https://img.icons8.com/ios-filled/50/154d71/github.png"
                                                    alt="GitHub" width="12" height="12"
                                                    style="border:0;vertical-align:middle;margin-right:4px;">
                                                https://github.com/abdullafajal</a></div>
                                        <div class="sender-role" style="margin-top: 2px;"><a
                                                href="https://www.linkedin.com/in/abdullafajal" target="_blank"
                                                style="color: #656d77; text-decoration: none;"><img
                                                    src="https://img.icons8.com/ios-filled/50/154d71/linkedin.png"
                                                    alt="LinkedIn" width="12" height="12"
                                                    style="border:0;vertical-align:middle;margin-right:4px;">
                                                https://www.linkedin.com/in/abdullafajal</a></div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
