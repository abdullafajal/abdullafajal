{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Abdulla Fajal - AI Portfolio{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700&display=swap" rel="stylesheet">

    <!-- Tabler Core CSS (used for components) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">

    <!-- Project theme overrides -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">

    {% block head_extra %}{% endblock %}
</head>
<body class="theme-light">
    <div class="page">
        {% include "portfolio/_navbar.html" %}

        <main style="margin-top: 80px;">
            {% block content %}{% endblock %}
        </main>

        {% include "portfolio/_footer.html" %}
    </div>

    <!-- GSAP (GreenSock) for small animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Tabler Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>

    <!-- Theme JS -->
    <script src="{% static 'js/theme.js' %}"></script>

    {% block scripts %}{% endblock %}

    {% include "portfolio/_chat.html" %}
</body>
</html>
